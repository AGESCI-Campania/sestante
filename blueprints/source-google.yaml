version: 1
metadata:
  name: Sestante - Accesso con Google

# Procedura completa (Google Cloud Console, .env, verifica): docs/LOGIN-SOCIAL.md.
# La sorgente esiste sempre, ma è attiva (pulsante sulla pagina di login) solo con entrambe le
# credenziali in .env: senza, resta spenta con valori segnaposto.
entries:
  - model: authentik_sources_oauth.oauthsource
    identifiers:
      slug: google
    attrs:
      name: Google
      provider_type: google
      consumer_key: !Env [SOCIAL_GOOGLE_CLIENT_ID, da-configurare]
      consumer_secret: !Env [SOCIAL_GOOGLE_CLIENT_SECRET, da-configurare]
      enabled: !Condition [AND, !Env SOCIAL_GOOGLE_CLIENT_ID, !Env SOCIAL_GOOGLE_CLIENT_SECRET]
      # Entra solo chi ha già un account Sestante con la stessa email (Google verifica gli
      # indirizzi); nessuna registrazione automatica per gli sconosciuti.
      user_matching_mode: email_link
      enrollment_flow: null
      # Flow di default: nessun secondo fattore su Sestante, vale quello dell'account Google/Apple
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
