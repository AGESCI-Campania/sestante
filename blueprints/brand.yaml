version: 1
metadata:
  name: Brand — Piattaforme Regionali Scout Campania
entries:
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: "Piattaforme Regionali Scout Campania"
      branding_logo: "https://auth.agescicampania.org/media/logo.svg"
      branding_favicon: "https://auth.agescicampania.org/media/favicon.png"
      default_locale: it
      branding_default_flow_background: "https://auth.agescicampania.org/media/background.jpeg"
      branding_custom_css: |
        :root {
          --ak-accent: #7a1e99;
          --pf-global--primary-color--100: #7a1e99;
          --pf-global--primary-color--200: #622599;
        }
