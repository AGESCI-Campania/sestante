version: 1
metadata:
  name: Brand — Piattaforme Regionali Scout Campania
entries:
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: authentik-default
    attrs:
      # Immagini: resources/ montata in /web/dist/assets/agesci (docker-compose.override.yml),
      # servita pubblicamente da Authentik su /static/dist/assets/agesci/ (in 2026.x /media non
      # esiste più e i file caricati in /data hanno URL firmati che scadono).
      # Unico brand dell'istanza: deve essere quello di default, altrimenti per
      # auth.agescicampania.net (che non corrisponde a "authentik-default") Authentik usa un
      # brand vuoto interno — senza logo, CSS e flow di recupero.
      default: true
      branding_title: "Piattaforme Regionali Scout Campania"
      branding_logo: "/static/dist/assets/agesci/logo.png"
      branding_favicon: "/static/dist/assets/agesci/favicon.png"
      default_locale: it
      # Flow di recupero del brand: abilita i link di recupero generati/inviati dall'admin
      # (il link "Password dimenticata?" del login è invece in flow-recovery.yaml)
      flow_recovery: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      branding_default_flow_background: "/static/dist/assets/agesci/background.jpeg"
      branding_custom_css: |
        :root {
          --ak-accent: #7a1e99;
          --pf-global--primary-color--100: #7a1e99;
          --pf-global--primary-color--200: #622599;
        }
        /* Il logo è verticale (987x1345): Authentik lo adatta alla larghezza, troppo alto nella
           pagina di login e minuscolo nella barra dopo il login. Il CSS del brand è applicato
           dentro ogni componente (shadow DOM): selettori di FlowExecutor e ak-page-navbar. */
        .pf-c-login__main-header.pf-c-brand img,
        img.branding-logo {
          width: auto !important;
          max-width: 100% !important;
          max-height: 160px !important;
        }
        aside.brand .logo img {
          width: auto !important;
          height: 56px !important;
          max-height: 56px !important;
        }
