version: 1
metadata:
  name: Sestante - Provider Tana

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-tana
    identifiers:
      name: Tana AGESCI Campania
    attrs:
      name: Tana AGESCI Campania
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
      sub_mode: hashed_user_id
      redirect_uris:
        - url: "https://baseaiello.agescicampania.net/accounts/oidc/sestante/login/callback/"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        # Immagine del profilo caricata su Sestante (scope-avatar.yaml)
        - !Find [authentik_providers_oauth2.scopemapping, [name, "Sestante: avatar"]]
      # client_id e client_secret sono generati da Authentik. Dopo l'applicazione del
      # blueprint recuperarli da https://auth.agescicampania.net/if/admin/#/core/providers
      # → Tana AGESCI Campania → modifica, e copiarli in /opt/prenotazionebase/.env come
      # SOCIAL_SESTANTE_CLIENT_ID e SOCIAL_SESTANTE_CLIENT_SECRET.

  - model: authentik_core.application
    identifiers:
      slug: tana
    attrs:
      name: Tana – Prenotazioni Base Aiello
      slug: tana
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Tana AGESCI Campania]]
      # all: ogni binding deve passare, compreso sestante-accesso-piattaforme (con any un altro
      # binding che passa farebbe entrare anche gli invitati di altre piattaforme)
      policy_engine_mode: all
      meta_launch_url: "https://baseaiello.agescicampania.net/accounts/oidc/sestante/login/?next=/gestione/"
      # Icona nel dashboard: pubblicata da Tana (INTEGRAZIONE-SSO.md § 4)
      meta_icon: "https://baseaiello.agescicampania.net/static/tana/img/pwa/icona-192.png"

  # Utenti invitati da un'altra piattaforma: niente accesso (inviti-piattaforme.yaml)
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, sestante-accesso-piattaforme]]
      target: !Find [authentik_core.application, [slug, tana]]

  # --- Inviti creati da Tana (inviti-piattaforme.yaml, docs/INVITI-PIATTAFORME.md) ---
  # Ruolo della sola Tana: i permessi sugli inviti creati vanno al ruolo, quindi un ruolo per
  # piattaforma (con uno condiviso le piattaforme vedrebbero e revocherebbero gli inviti altrui).
  - model: authentik_rbac.role
    id: ruolo-inviti-tana
    identifiers:
      name: inviti-tana
    attrs:
      permissions:
        - authentik_stages_invitation.add_invitation

  - model: authentik_rbac.initialpermissions
    identifiers:
      name: inviti-tana - inviti creati
    attrs:
      role: !KeyOf ruolo-inviti-tana
      permissions:
        - !Find [auth.permission, [content_type__app_label, authentik_stages_invitation], [codename, view_invitation]]
        - !Find [auth.permission, [content_type__app_label, authentik_stages_invitation], [codename, delete_invitation]]

  # Vista del flusso di iscrizione, per leggerne il pk
  - model: authentik_flows.flow
    identifiers:
      slug: sestante-iscrizione-invito
    permissions:
      - permission: authentik_flows.view_flow
        role: !KeyOf ruolo-inviti-tana

  # attributes.piattaforma = slug dell'applicazione: diventa l'unica piattaforma consentita
  # agli utenti invitati da questo account (insieme al ruolo inviti-tana).
  - model: authentik_core.user
    id: svc-tana
    identifiers:
      username: svc-tana
    attrs:
      name: Tana - inviti
      type: service_account
      path: servizi/piattaforme
      is_active: true
      attributes:
        piattaforma: tana
      roles:
        - !KeyOf ruolo-inviti-tana

  # La chiave la genera Authentik: recuperarla da Directory → Tokens and App passwords →
  # svc-tana-inviti → copia, e metterla in /opt/prenotazionebase/.env come SESTANTE_INVITI_TOKEN.
  - model: authentik_core.token
    identifiers:
      identifier: svc-tana-inviti
    attrs:
      user: !KeyOf svc-tana
      intent: api
      expiring: false
      description: Tana - creazione degli inviti su Sestante
