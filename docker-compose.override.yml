services:
  server:
    volumes:
      - ./blueprints:/blueprints/local
      # Logo, favicon, sfondo: serviti su /static/dist/assets/agesci/ (vedi blueprints/brand.yaml)
      - ./resources:/web/dist/assets/agesci:ro
    networks:
      default:
      # Rete condivisa con Caddy (repo agesci-campania-web-frontend): il traffico pubblico
      # arriva da qui. Vedi docs/INTEGRAZIONE.md in quel repo.
      agesci-proxy:
        aliases:
          - sestante-server
  worker:
    volumes:
      - ./blueprints:/blueprints/local

networks:
  agesci-proxy:
    external: true
