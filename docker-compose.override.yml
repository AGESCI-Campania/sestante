services:
  server:
    volumes:
      - ./blueprints:/blueprints/local
      # Logo, favicon, sfondo: serviti su /static/dist/assets/agesci/ (vedi blueprints/brand.yaml)
      - ./resources:/web/dist/assets/agesci:ro
      # Logo incorporato nelle email (cid:logo): Authentik allega sempre questo file, qui
      # sostituito con il nostro. Bind mount di un file singolo: se logo.png cambia, serve
      # `docker compose up -d --force-recreate server worker`.
      - ./resources/logo.png:/web/dist/assets/icons/icon_left_brand.png:ro
      # Avatar di chi non ha caricato un'immagine (modo `none` di AVATAR_MODI in
      # scripts/_sestante.sh, che restituisce questo file). Bind mount di un file singolo come sopra.
      - ./resources/avatar.png:/web/dist/assets/images/user_default.png:ro
    networks:
      default:
      # Rete condivisa con Caddy (repo agesci-campania-web-frontend): il traffico pubblico
      # arriva da qui. Vedi docs/INTEGRAZIONE.md in quel repo.
      agesci-proxy:
        aliases:
          - sestante-server
  worker:
    volumes:
      - ./blueprints:/blueprints/local
      # File segreti letti dai blueprint con !File (es. chiave Apple, source-apple.yaml);
      # cartella esclusa da git, inclusa nel backup.
      - ./secrets:/sestante-secrets:ro
      # Logo incorporato nelle email (cid:logo): Authentik allega sempre questo file, qui
      # sostituito con il nostro. Bind mount di un file singolo: se logo.png cambia, serve
      # `docker compose up -d --force-recreate server worker`.
      - ./resources/logo.png:/web/dist/assets/icons/icon_left_brand.png:ro

networks:
  agesci-proxy:
    external: true
